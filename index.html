<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilfeldig Filmvelger</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Tilfeldig Filmvelger</h1>
        <p>Usikker på hva du skal se i kveld? La tilfeldigheten bestemme!</p>
    </header>

<main>

    <h2>Alle filmer i samlingen</h2> 

    <section id="movie-section">
      <div id="movie-container"></div>
    </section>

    <section id="random-section">
        <button id="random-button">Velg en tilfeldig film!</button>
        <div id="selected-movie-container"></div>
    </section>

    <section id="add-movie-section">
    <h2>Legg til en ny film</h2>
    <div class="add-own-movie">
        <input type="text" id="title-input" placeholder="Filmtittel...">
        <button id="add-button">Legg til film</button>
    </div>
    </section>

    <section>
        <button id="reset-button">Tilbakestill samlingen</button>
    </section>

</main> 



</body>
</html>
